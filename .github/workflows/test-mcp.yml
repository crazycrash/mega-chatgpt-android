name: Test MCP Server

on:
  push:
    branches:
      - feature/mega-connector-v1
  workflow_dispatch:

jobs:
  typecheck-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: mcp-server
        run: npm install

      - name: Typecheck
        working-directory: mcp-server
        run: npm run typecheck

      - name: Test encrypted multi-account vault
        working-directory: mcp-server
        run: npm test
